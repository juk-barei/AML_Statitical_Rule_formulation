[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data_analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jupyterlab>=4.6.5",
    "jupyterlab-vim>=4.1.4",
    "matplotlib>=3.11.2",
    "mypy>=2.4.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pandas-stubs>=3.1.0.261029",
    "psycopg2>=2.9.13",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "varname>=1.0.0",
]
[tool.setuptools]
py-modules = ["config"]
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

